apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: poc-pmb
  labels:
    app: dashboard
    autopoc.io/project: pmb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: quay.io/aicatalyst/pmb-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PMB_HOME
              value: "/opt/app-root/src/.pmb"
            - name: HOME
              value: "/opt/app-root/src"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
